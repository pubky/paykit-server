name: Build and Publish Docker Image

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  # One release publish at a time. Runs queue (never cancelled), so each run
  # decides :latest only after every earlier release has pushed.
  group: docker-publish
  cancel-in-progress: false
  queue: max

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Decide whether this tag is the newest stable release
        id: latest
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        # fetch-depth: 0 fetches every tag, so the local list is complete.
        run: sh scripts/release-latest-tag.sh "$TAG"

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: pubky/ci-workflows/.github/actions/docker/build_and_push@5faaf004d36bb93a204b58cf7190ffe7fbcce16f # v1.0.2
        with:
          registry: registry-1.docker.io/synonymsoft
          context: .
          push: true
          # Only the newest stable vX.Y.Z tag moves :latest. The version tag is
          # emitted as type=raw because type=ref,event=tag would add :latest on
          # every tag under metadata-action's default latest=auto flavor.
          # priority=600 (as type=ref,event=tag had) keeps the git tag, not
          # :latest or the commit SHA, as the image version label.
          latest: ${{ steps.latest.outputs.latest }}
          tags: |
            type=raw,value={{tag}},priority=600
          platforms: |
            linux/arm64
            linux/amd64
          image: paykit-server
