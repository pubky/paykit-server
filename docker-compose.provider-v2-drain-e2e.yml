services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 1s
      timeout: 5s
      retries: 30

  provider-v2-drain-e2e:
    image: rust:1.91.1-bookworm
    working_dir: /workspace
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TEST_DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
      CARGO_HOME: /cargo
      CARGO_TARGET_DIR: /target
      CARGO_INCREMENTAL: "0"
    volumes:
      - .:/workspace:ro
      - provider-v2-drain-cargo:/cargo
      - provider-v2-drain-target:/target
    command:
      - /bin/bash
      - -euc
      - |
        apt-get update
        apt-get install -y --no-install-recommends clang lld cmake libssl-dev pkg-config
        rm -rf /var/lib/apt/lists/*
        cargo test --locked -p paykit-server-e2e --test invoices -- --test-threads=1
        cargo test --locked -p paykit-server-e2e --test payment_drains -- --test-threads=1
        cargo test --locked -p paykit-server-e2e --test migrations -- --test-threads=1

volumes:
  provider-v2-drain-cargo:
  provider-v2-drain-target:
