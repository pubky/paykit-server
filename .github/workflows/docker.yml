name: Build and Publish Docker Image

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Decide whether this tag is the newest stable release
        id: latest
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          stable='^v[0-9]+\.[0-9]+\.[0-9]+$'
          newest=''
          latest=false
          if [[ "$TAG" =~ $stable ]]; then
            # fetch-depth: 0 fetches every tag, so the local list is complete.
            newest="$(git tag -l 'v*' | { grep -E "$stable" || true; } | sort -V | tail -n1)"
            if [[ "$TAG" == "$newest" ]]; then
              latest=true
            else
              echo "::warning::$TAG is not the newest stable tag ('${newest:-none found}'), so :latest was left unchanged"
            fi
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "Tag $TAG: newest stable tag=${newest:-n/a}, latest=$latest"

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: pubky/ci-workflows/.github/actions/docker/build_and_push@5faaf004d36bb93a204b58cf7190ffe7fbcce16f # v1.0.2
        with:
          registry: registry-1.docker.io/synonymsoft
          context: .
          push: true
          # Only the newest stable vX.Y.Z tag moves :latest. The version tag is
          # emitted as type=raw because type=ref,event=tag would add :latest on
          # every tag under metadata-action's default latest=auto flavor.
          # priority=600 (as type=ref,event=tag had) keeps the git tag, not
          # :latest or the commit SHA, as the image version label.
          latest: ${{ steps.latest.outputs.latest }}
          tags: |
            type=raw,value={{tag}},priority=600
          platforms: |
            linux/arm64
            linux/amd64
          image: paykit-server
